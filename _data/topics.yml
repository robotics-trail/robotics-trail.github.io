# Research topics, in the order the filter buttons appear.
#
# `id` must match the values used in the `topics:` list of publications.yml.
# The set is deliberately not orthogonal: a paper is tagged with the problem it
# addresses (planning, estimation), the method it uses (optimization, learning,
# constrained-nn) and the platform it runs on (aerial, legged). Most papers
# therefore carry two or three tags and show up under each.
#
# Adding a category: add it here, tag the relevant papers, done. No template
# change. `other` is the catch-all for work that fits none of the rest.

- id: planning
  short: "Trajectory Planning"

- id: optimization
  short: "Optimization"

- id: learning
  short: "Learning-based"

- id: aerial
  short: "Aerial Robots"

- id: legged
  short: "Legged Robots"

- id: estimation
  short: "State Estimation"

- id: constrained-nn
  short: "Constrained NN"

- id: other
  short: "Other"
