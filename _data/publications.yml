# =============================================================================
#  TRAIL publications
# =============================================================================
#  These entries render exactly the cards the site has always shown. The only
#  thing that changed is that the list moved out of _config.yml (which Jekyll
#  never reloads) and each entry gained `topics`, which drive the filter
#  buttons, and a real `alt`.
#
#  FIELDS
#    title        card heading
#    bibkey       the entry in _bibliography/bibliography.bib. NOTHING is
#                 rendered from it today -- the card is built from `excerpt`
#                 below, exactly as before. It is here so the bibliographic
#                 facts (authors, venue, year, DOI, citations) have one home
#                 instead of being retyped, and so they can be switched on
#                 later: see the commented block in
#                 _includes/publication-row.html.
#    also         further bibkeys for the same work (a conference paper and
#                 its journal version).
#    topics       any of: planning, optimization, learning, aerial, legged,
#                 estimation, constrained-nn, other. Drives the filter buttons.
#                 See _data/topics.yml.
#    image_path   figure, relative to the site root
#    alt          REQUIRED. One descriptive sentence, for screen readers.
#                 (Every entry used to say "placeholder image 1".)
#    image_caption   optional caption under the figure
#    excerpt      the card body. Markdown; {: .btn ...} adds button styling.
#                 This is what the page actually renders.
#
#  TO ADD A PAPER: copy a block to the top, fill it in, commit.
# =============================================================================

