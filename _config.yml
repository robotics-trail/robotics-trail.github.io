# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: TRAIL
# The masthead brand, og:site_name and the tail of every page title all read
# site.title. It used to say "Jesus Tordesillas Torres", which fought with the
# hero, the repo name and the description, all of which say TRAIL. The lab is
# the site; the person has their own page and their own Person schema.
# Masthead logo, shown left of the title on every page. It is drawn ~44px
# tall, so the file is 128px (sharp on retina, ~10 KB). The full-size logo is
# assets/images/trail-logo.webp; the favicons are wired up in
# _includes/head/custom.html.
logo: /assets/images/trail-logo-128.webp
repository: robotics-trail/robotics-trail.github.io
email: jtordesillas@comillas.edu
description: >- # this means to ignore newlines until "baseurl:"
  TRAIL is the Trustworthy Robotics and AI Lab at IIT, Comillas-ICAI (Madrid),
  led by Prof. Jesus Tordesillas. We work on optimization- and learning-based
  trajectory planning, and on imposing hard constraints on neural networks.
# twitter_username:            # was the literal placeholder "username", which
                               # put a bogus twitter:creator tag on every page.
                               # Uncomment and fill in if the lab opens an account.
github_username: jtorde
url: https://robotics-trail.github.io
og_image: /assets/images/mader_header_white.webp  # fallback social-preview image
minimal_mistakes_skin: default

# --- schema.org identity ----------------------------------------------------
# `sameAs` is how a machine decides that these profiles are all one entity, so
# only list profiles that really are the same thing, and make sure each one
# links back here. Org-level links and person-level links are kept apart on
# purpose -- the GitHub org is not the professor.
#
# Still missing, and worth adding (highest value first): an ORCID, a claimed
# Semantic Scholar author page, an OpenAlex author record, a Wikidata item.
# The ResearchGate entry is an auto-generated stub rather than a claimed
# profile, so it is deliberately not listed.
org_sameas:
  - https://github.com/robotics-trail

person_sameas:
  - https://github.com/jtorde
  - https://scholar.google.com/citations?user=QKcwqsQAAAAJ
  - https://dblp.org/pid/228/6616.html
  - https://openreview.net/profile?id=~Jesus_Tordesillas1
  - https://www.linkedin.com/in/jesus-tordesillas-torres/
  - https://www.iit.comillas.edu/people/jtordesillas
#search: true

#This next line needs to be commented for github.io
# baseurl: /~jtorde #For MIT website. (url will then be mit.edu/~jtorde)

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
# - jekyll-scholar   # NOT on the GitHub Pages plugin allowlist and not in the
#                    # Gemfile, so it never actually ran. Removed to avoid the
#                    # impression that .bib rendering is available.

author:
  name   : "Jesus Tordesillas Torres"   # no "PI: " prefix -- this string goes
                                        # verbatim into <meta name="author">
  avatar : "/assets/images/foto_mia2.webp"  # rasterised from the old 402 KB SVG
  bio    : "Assistant Professor at IIT, Comillas-ICAI. Principal Investigator of TRAIL."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jtorde"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jesus-tordesillas-torres/"
    - label: "Google Scholar"
      icon: "fa fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=QKcwqsQAAAAJ&hl=en&oi=sra"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jtorde"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jesus-tordesillas-torres/"
    - label: "Google Scholar"
      icon: "fa fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=QKcwqsQAAAAJ&hl=en&oi=sra"

defaults:
  # _posts
  # - scope:
  #     path: ""
  #     type: posts
  #   values:
  #     layout: splash
  #     author_profile: true
  #     read_time: true
  #     comments: true
  #     share: true
  #     related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: splash
      author_profile: true
      announcement:
        - excerpt: "<div class='notice--danger' style='font-weight: bold; font-size: 1.0em !important; color: red;'>Our research group is constantly looking for top PhD and Postdoc students. If you are interested in joining us, send an email to <a href='mailto:jtordesillas@comillas.edu'>jtordesillas@comillas.edu</a></div> "

      # mylinks: moved to _data/links.yml, rendered by _includes/links-row.html.
      # It was HTML in YAML, spaced with runs of non-breaking spaces.

      publicationstitle:
        # The button opens /bibliography/, which renders bibliography.bib itself.
        - excerpt: "<div class='notice--success' style='font-weight: bold; font-size: 1.5em !important; color: black;'>PUBLICATIONS <a class='btn btn--small btn--inverse bib-view-btn' href='/bibliography/' target='_blank' rel='noopener'>View .bib</a></div>"

      # publications:  moved to _data/publications.yml
      #
      # ~250 lines of publication markup used to live here. Jekyll does not
      # reload _config.yml, so editing a paper meant restarting the server,
      # and one bad indent could take the whole site config with it. The list
      # is now data, rendered by _includes/publication-row.html, which emits
      # the same markup feature_row did.

  # Nothing under assets/ is a page, but jekyll-sitemap lists static files by
  # default -- which is how /assets/images/vhdl_schematic_designed.pdf ended up
  # in the sitemap. Same for the Search Console verification file.
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "googled88caa9468c1d38e.html"
    values:
      sitemap: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
